[project]
name = "mkk-basis"
version = "0.1.0"
description = "Asynchronous payment processing with transactional outbox"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.128,<1", "uvicorn>=0.35,<1", "pydantic>=2.12,<3",
  "pydantic-settings>=2.10,<3", "sqlalchemy[asyncio]>=2.0.40,<2.1",
  "asyncpg>=0.30,<1", "alembic>=1.16,<2", "faststream[rabbit]==0.7.8",
  "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1",
       "mypy>=1.16,<2", "import-linter>=2,<3", "asgi-lifespan>=2,<3"]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mkk_basis"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".agents"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: requires real PostgreSQL and RabbitMQ"]
addopts = "-ra"

[tool.importlinter]
root_package = "mkk_basis"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Clean Architecture dependency direction"
type = "layers"
layers = ["mkk_basis.bootstrap", "mkk_basis.adapters", "mkk_basis.application", "mkk_basis.domain"]

[[tool.importlinter.contracts]]
name = "Independent core"
type = "forbidden"
source_modules = ["mkk_basis.domain", "mkk_basis.application"]
forbidden_modules = ["fastapi", "pydantic", "sqlalchemy", "faststream", "httpx", "asyncpg", "os"]
