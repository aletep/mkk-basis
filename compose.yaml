name: mkk-basis

x-app-env: &app-env
  API_KEY: ${API_KEY:?Copy .env.example to .env}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  AMQP_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
  WEBHOOK_ALLOWED_ORIGINS: ${WEBHOOK_ALLOWED_ORIGINS:-["http://webhook-receiver:8000"]}

x-app-build: &app-build
  context: .
  target: runtime

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 30

  rabbitmq:
    image: rabbitmq:4.4.0-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, check_running]
      interval: 3s
      timeout: 5s
      retries: 30

  api:
    image: mkk-basis:local
    build: *app-build
    environment: *app-env
    command: [sh, -c, 'alembic upgrade head && exec uvicorn mkk_basis.bootstrap.api:create_app --factory --host 0.0.0.0 --port 8000 --no-access-log']
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, 'import os,urllib.request; urllib.request.urlopen(urllib.request.Request("http://127.0.0.1:8000/health",headers={"X-API-Key":os.environ["API_KEY"]}),timeout=3)']
      interval: 3s
      timeout: 5s
      retries: 20

  consumer:
    image: mkk-basis:local
    build: *app-build
    environment: *app-env
    command: [python, -m, mkk_basis.bootstrap.consumer]
    restart: on-failure
    stop_grace_period: 35s
    depends_on:
      api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  webhook-receiver:
    profiles: [demo]
    image: mkk-basis:local
    build: *app-build
    command: [uvicorn, mkk_basis.bootstrap.demo:app, --host, 0.0.0.0, --port, '8000', --no-access-log]
    ports:
      - "127.0.0.1:${DEMO_PORT:-8001}:8000"

  tests:
    profiles: [test]
    image: mkk-basis-tests:local
    build:
      context: .
      target: test
    environment:
      API_KEY: isolated-tests-api-key-only
      DATABASE_URL: postgresql+asyncpg://test_payments:test-only-password@test-postgres:5432/mkk_basis_test
      AMQP_URL: amqp://test_payments:test-only-password@test-rabbitmq:5672/mkk_basis_test
      WEBHOOK_ALLOWED_ORIGINS: '["http://receiver"]'
      RUN_INTEGRATION: '1'
      INTEGRATION_RESOURCE_SCOPE: mkk-basis-tests-v1
    depends_on:
      test-postgres:
        condition: service_healthy
      test-rabbitmq:
        condition: service_healthy

  test-postgres:
    profiles: [test]
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: test_payments
      POSTGRES_PASSWORD: test-only-password
      POSTGRES_DB: mkk_basis_test
    volumes:
      - test-postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD, pg_isready, -U, test_payments, -d, mkk_basis_test]
      interval: 2s
      timeout: 3s
      retries: 30

  test-rabbitmq:
    profiles: [test]
    image: rabbitmq:4.4.0-management-alpine
    hostname: test-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: test_payments
      RABBITMQ_DEFAULT_PASS: test-only-password
      RABBITMQ_DEFAULT_VHOST: mkk_basis_test
    volumes:
      - test-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, check_running]
      interval: 3s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
  rabbitmq-data:
  test-postgres-data:
  test-rabbitmq-data:
